[package]
name = "turtlefin"
version = "1.9.7"
edition = "2021"
description = "Client Jellyfin natif (Rust + Slint), sans Qt ni navigateur embarqué"
repository = "https://github.com/Xelopteryx/Turtlefin"
license = "GPL-3.0-or-later"
authors = ["Xelopteryx"]

[dependencies]
slint = { version = "~1.18", features = ["unstable-winit-030"] }
# Lecture : libmpv chargée à l'exécution, rendu OpenGL de la vidéo dans la fenêtre Slint.
libloading = "0.8"
glow = "0.17"
# Watch party (SyncPlay) : connexion WebSocket au serveur.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
# Heure locale (« Fin à 22:47 »).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "net", "io-util", "process"] }
# reqwest 0.13 : rustls par défaut, avec le magasin de certificats du système
# (un certificat mkcert installé sur la machine est donc accepté).
# "query" est devenu une option dans la 0.13.
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
if-addrs = "0.15.0"
# Diffuser : recherche multidiffusée carte par carte, connexion TLS aux appareils Google Cast.
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
# Mise à jour : empreinte SHA-256 du fichier téléchargé, comparée à celle publiée par GitHub.
sha2 = "0.10"

# Place libre sur le disque des téléchargements (statvfs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
# 16 unités de génération de code (au lieu de 1) : la longue phase finale d'optimisation se répartit
# sur tous les cœurs au lieu d'un seul (le gros crate turtlefin : code Slint généré d'environ 21 Mo).
# Binaire quasi identique (quelques % au plus) ; compilation bien plus rapide. Le thin-LTO, lui, est
# déjà parallèle. incremental : réutilise ce qui n'a pas changé d'une compilation à l'autre (mises au
# point successives). La vérification du crate reste mono-cœur (parallèle seulement en Rust nightly).
codegen-units = 16
incremental = true
strip = true

# Paquet .deb (cargo deb) : Debian, Ubuntu et dérivées. libmpv vient du système.
[package.metadata.deb]
name = "turtlefin"
maintainer = "Xelopteryx <https://github.com/Xelopteryx/Turtlefin>"
section = "video"
priority = "optional"
# Bibliothèques chargées au démarrage (dlopen), invisibles pour $auto : sans libxkbcommon-x11-0,
# Turtlefin s'arrêtait aussitôt lancé sur une Debian minimale (PC Intel « Mjollnir »).
depends = "$auto, libmpv2 | libmpv1, libxkbcommon-x11-0, libxkbcommon0, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6, libegl1, libgl1, libwayland-client0, libwayland-egl1, libwayland-cursor0, libfontconfig1"
extended-description = "Client Jellyfin natif, léger et animé, pensé pour la télé : accueil, fiches, lecture (libmpv), watch party, téléchargements hors ligne, demandes Seerr."
assets = [
    ["target/release/turtlefin", "usr/bin/", "755"],
    ["packaging/linux/turtlefin.desktop", "usr/share/applications/", "644"],
    ["packaging/turtlefin.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/turtlefin/", "644"],
]
