[package]
name = "turtlefin"
version = "0.4.0"
edition = "2021"
description = "Client Jellyfin natif (Rust + Slint), sans Qt ni navigateur embarqué"

[dependencies]
slint = "1"
# Lecture : libmpv chargée à l'exécution, rendu OpenGL de la vidéo dans la fenêtre Slint.
libloading = "0.8"
glow = "0.17"
# Watch party (SyncPlay) : connexion WebSocket au serveur.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
# Heure locale (« Fin à 22:47 »).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
# reqwest 0.13 : rustls par défaut, avec le magasin de certificats du système
# (un certificat mkcert installé sur la machine est donc accepté).
# "query" est devenu une option dans la 0.13.
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
