[package]
name = "turtlefin"
version = "0.9.1"
edition = "2021"
description = "Client Jellyfin natif (Rust + Slint), sans Qt ni navigateur embarqué"
repository = "https://github.com/Xelopteryx/Turtlefin"
authors = ["Xelopteryx"]

[dependencies]
slint = { version = "~1.18", features = ["unstable-winit-030"] }
# Lecture : libmpv chargée à l'exécution, rendu OpenGL de la vidéo dans la fenêtre Slint.
libloading = "0.8"
glow = "0.17"
# Watch party (SyncPlay) : connexion WebSocket au serveur.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
# Heure locale (« Fin à 22:47 »).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
# reqwest 0.13 : rustls par défaut, avec le magasin de certificats du système
# (un certificat mkcert installé sur la machine est donc accepté).
# "query" est devenu une option dans la 0.13.
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
if-addrs = "0.15.0"

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Paquet .deb (cargo deb) : Debian, Ubuntu et dérivées. libmpv vient du système.
[package.metadata.deb]
name = "turtlefin"
maintainer = "Xelopteryx <https://github.com/Xelopteryx/Turtlefin>"
section = "video"
priority = "optional"
depends = "$auto, libmpv2 | libmpv1"
extended-description = "Client Jellyfin natif, léger et animé, pensé pour la télé : accueil, fiches, lecture (libmpv), watch party, téléchargements hors ligne, demandes Seerr."
assets = [
    ["target/release/turtlefin", "usr/bin/", "755"],
    ["packaging/linux/turtlefin.desktop", "usr/share/applications/", "644"],
    ["packaging/turtlefin.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/turtlefin/", "644"],
]
