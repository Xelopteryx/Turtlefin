# Publication d'une version : compile Turtlefin pour Windows (x64, x86) et Linux (x86_64,
# aarch64, et en 32 bits armhf et i386), fabrique les paquets et les attache à une publication
# GitHub. Les APK Android (arm64, armv7) sont signés hors de GitHub et ajoutés ensuite.
#
# Déclenchement : pousser une étiquette de version, par exemple
#   git tag -a v0.9.2 -m "Nouveautés, une par ligne" && git push origin v0.9.2
# Essai sans publier : pousser sur la branche « ci » (git push origin main:ci), ou lancer à la main
# depuis l'onglet Actions.
#
# Fichiers produits (noms attendus par la mise à jour intégrée, voir src/update.rs) :
#   Turtlefin-<v>-windows-x64-setup.exe   Turtlefin-<v>-windows-x64-portable.zip
#   Turtlefin-<v>-windows-x86-setup.exe   Turtlefin-<v>-windows-x86-portable.zip
#   Turtlefin-<v>-linux-x86_64.AppImage   turtlefin_<v>_amd64.deb
#   Turtlefin-<v>-linux-aarch64.AppImage  turtlefin_<v>_arm64.deb
#   turtlefin_<v>_armhf.deb (Raspberry Pi OS 32 bits)   turtlefin_<v>_i386.deb (PC 32 bits)
name: Publication

on:
  push:
    tags: ["v*"]
    # Branche « ci » : tout est compilé et empaqueté, rien n'est publié (essai de la chaîne).
    branches: ["ci"]
  workflow_dispatch:

# Droits minimaux : lecture seule pour la compilation ; seule la publication écrit (voir « publish »).
# Actions fixées sur un commit (une étiquette peut être déplacée par son auteur, ou par qui le pirate) :
# pour les mettre à jour, remplacer l'empreinte par celle de la nouvelle version.
permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.arch == 'x64' && 'x86_64-pc-windows-msvc' || 'i686-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.arch }}
      - name: Inno Setup et NASM
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          choco install nasm -y --no-progress
      - name: Paquets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: packaging\windows\build.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            target/dist/*.exe
            target/dist/*.zip

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            deb: arm64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 : glibc 2.35, l'AppImage fonctionne donc sur les distributions de 2022 et après
    # (Debian 12, Ubuntu 22.04...).
    runs-on: ${{ matrix.runner }}
    env:
      TURTLEFIN_DIST: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libxcb1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libmpv-dev file wget
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.arch }}
      - name: Compilation
        run: cargo build --release
      - name: AppImage
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sh packaging/linux/build-appimage.sh "$VERSION"
      - name: Paquet .deb
        run: |
          cargo install cargo-deb --locked
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cargo deb --no-build --output "target/turtlefin_${VERSION}_${{ matrix.deb }}.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/*.AppImage
            target/*.deb

  # Linux 32 bits : compilation croisée dans Debian 12 (bibliothèques armhf / i386 du système, comme
  # sur Raspberry Pi OS 32 bits et Debian i386). Paquet .deb seulement.
  linux32:
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb: armhf
            target: armv7-unknown-linux-gnueabihf
            multiarch: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf
          - deb: i386
            target: i686-unknown-linux-gnu
            multiarch: i386-linux-gnu
            cc: i686-linux-gnu
    runs-on: ubuntu-latest
    container: debian:12
    env:
      TURTLEFIN_DIST: release
    steps:
      - name: Outils et bibliothèques ${{ matrix.deb }}
        run: |
          dpkg --add-architecture ${{ matrix.deb }}
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl build-essential pkg-config file dpkg-dev \
            crossbuild-essential-${{ matrix.deb }} \
            libfontconfig1-dev:${{ matrix.deb }} libxkbcommon-dev:${{ matrix.deb }} libxkbcommon-x11-dev:${{ matrix.deb }} \
            libx11-dev:${{ matrix.deb }} libxcb1-dev:${{ matrix.deb }} libgl1-mesa-dev:${{ matrix.deb }} \
            libegl1-mesa-dev:${{ matrix.deb }} libwayland-dev:${{ matrix.deb }} libmpv-dev:${{ matrix.deb }}
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.deb }}
      - name: Compilation croisée
        run: |
          T=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          t=$(echo "${{ matrix.target }}" | tr '-' '_')
          export CARGO_TARGET_${T}_LINKER=${{ matrix.cc }}-gcc
          export CC_${t}=${{ matrix.cc }}-gcc CXX_${t}=${{ matrix.cc }}-g++ AR_${t}=${{ matrix.cc }}-ar
          export PKG_CONFIG_ALLOW_CROSS=1 PKG_CONFIG_SYSROOT_DIR=/
          export PKG_CONFIG_LIBDIR=/usr/lib/${{ matrix.multiarch }}/pkgconfig:/usr/share/pkgconfig
          cargo build --release --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/turtlefin
      - name: Paquet .deb
        run: |
          cargo install cargo-deb --locked
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output "target/turtlefin_${VERSION}_${{ matrix.deb }}.deb"
          dpkg-deb --info "target/turtlefin_${VERSION}_${{ matrix.deb }}.deb" | grep -E "Architecture|Depends"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.deb }}
          path: target/*.deb

  publish:
    needs: [windows, linux, linux32]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Notes de version = message de l'étiquette annotée (git tag -a v1.2.3 -m "…"), affiché par la
      # mise à jour intégrée (4 premières lignes).
      # Titre de la Release : première ligne du message (« Turtlefin 1.1.0 — Interface Update »).
      - name: Notes de version
        id: notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          cat notes.md
          echo "title=$(head -n 1 notes.md)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publication GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
